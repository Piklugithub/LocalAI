
name: Hugging Face API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-huggingface-api:
    name: Test Hugging Face API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call Hugging Face API
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: Qwen/Qwen2.5-Coder-32B-Instruct
        run: |
          set -euo pipefail

          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::HF_TOKEN secret is missing."
            exit 1
          fi

          request_file="$(mktemp)"
          response_file="$(mktemp)"
          trap 'rm -f "$request_file" "$response_file"' EXIT

          jq -n '{
            model: env.HF_MODEL,
            messages: [{
              role: "user",
              content: "Review this C# method for bugs and suggest a safer implementation: public static int Divide(int a, int b) => a / b;"
            }],
            max_tokens: 512,
            stream: false
          }' > "$request_file"

          echo "Calling Hugging Face model: $HF_MODEL"

          http_status="$(curl -4 --silent --show-error \
            --connect-timeout 15 \
            --max-time 120 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            "https://router.huggingface.co/v1/chat/completions" \
            --header "Authorization: Bearer ${HF_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@$request_file")" || {
              echo "::error::Hugging Face request failed at network level."
              exit 1
            }

          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Hugging Face returned HTTP $http_status."
            jq -r '.error.message // .error // .' "$response_file" 2>/dev/null || true
            exit 1
          fi

          response="$(jq -r '.choices[0].message.content // empty' "$response_file")"

          if [[ -z "$response" ]]; then
            echo "::error::No response received from the model."
            exit 1
          fi

          echo "Hugging Face API connection successful!"
          echo "$response"
