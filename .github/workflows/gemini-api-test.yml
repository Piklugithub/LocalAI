
name: Gemini API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini-api:
    name: Test Gemini API connection
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:  
      - name: Check Google API connectivity
        shell: bash
        run: |
          echo "Checking DNS resolution..."
          getent ahosts generativelanguage.googleapis.com || true

          echo "Checking HTTPS connectivity over IPv4..."
          curl -4 -I \
            --connect-timeout 15 \
            --max-time 30 \
            https://generativelanguage.googleapis.com

      
      - name: Call Gemini API
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          set -euo pipefail

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::GEMINI_API_KEY secret is missing."
            exit 1
          fi

          prompt='Review this C# method for a potential bug.
          Explain the issue and suggest a safer implementation.

          public static int CalculateAverage(int total, int count)
          {
              return total / count;
          }'

          request_file="$(mktemp)"
          response_file="$(mktemp)"
          trap 'rm -f "$request_file" "$response_file"' EXIT

          jq -n --arg prompt "$prompt" '{
            contents: [{
              role: "user",
              parts: [{ text: $prompt }]
            }],
            generationConfig: {
              maxOutputTokens: 512
            }
          }' > "$request_file"

          for attempt in 1 2 3; do
            echo "Gemini request attempt $attempt of 3"

            if http_status="$(curl -4 --silent --show-error \
              --connect-timeout 15 \
              --max-time 120 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent" \
              --header "Content-Type: application/json" \
              --header "x-goog-api-key: ${GEMINI_API_KEY}" \
              --data-binary "@$request_file")"; then

              if [[ "$http_status" =~ ^2[0-9][0-9]$ ]]; then
                break
              fi

              if [[ ! "$http_status" =~ ^(429|500|502|503|504)$ ]]; then
                echo "::error::Gemini returned HTTP $http_status."
                jq -r '.error.message // .' "$response_file" 2>/dev/null || true
                exit 1
              fi

              echo "Temporary Gemini error: HTTP $http_status"
            else
              echo "Temporary HTTP/network failure."
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Gemini request failed after 3 attempts."
              jq -r '.error.message // .' "$response_file" 2>/dev/null || true
              exit 1
            fi

            delay=$((2 ** attempt))
            echo "Retrying in $delay seconds..."
            sleep "$delay"
          done

          review_text="$(jq -r '
            [.candidates[0].content.parts[]?.text? // empty]
            | join("\n")
          ' "$response_file")"

          if [[ -z "$review_text" ]]; then
            echo "::error::Gemini returned no text response."
            exit 1
          fi

          echo "Gemini API connection successful!"
          echo "$review_text"

