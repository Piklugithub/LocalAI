
name: Hugging Face Model Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-models:
    runs-on: ubuntu-latest

    steps:
      - name: Discover available chat models
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          status="$(curl --silent --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --output "$response" \
            --write-out "%{http_code}" \
            "https://router.huggingface.co/v1/models" \
            -H "Authorization: Bearer ${HF_TOKEN}")"

          if [[ "$status" != "200" ]]; then
            echo "::error::Model discovery failed: HTTP $status"
            jq -r '.error.message // .' "$response" 2>/dev/null || true
            exit 1
          fi

          echo "Available coding and instruction models:"
          jq -r '
            .data[]
            | select(
                (.id | ascii_downcase)
                | test("coder|qwen|deepseek|gemma|llama")
              )
            | . as $model
            | .providers[]?
            | select(.status == "live")
            | [
                $model.id,
                .provider,
                (.pricing.input // "unknown" | tostring),
                (.pricing.output // "unknown" | tostring),
                (.is_free // false | tostring)
              ]
            | @tsv
          ' "$response" |
          while IFS=$'\t' read -r model provider input output free; do
            echo "Model: $model"
            echo "Provider: $provider"
            echo "Input price (USD / million tokens): $input"
            echo "Output price (USD / million tokens): $output"
            echo "Free provider offer: $free"
            echo "-----------------------------"
          done
