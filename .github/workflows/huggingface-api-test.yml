
name: Hugging Face API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-huggingface-api:
    name: Test Hugging Face API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate Hugging Face Token
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::HF_TOKEN secret is missing."
            exit 1
          fi

          echo "Hugging Face token is configured."

      - name: Call Hugging Face API
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: Qwen/Qwen3.5-9B:deepinfra
        run: |
          set -euo pipefail

          REQUEST_FILE="$(mktemp)"
          RESPONSE_FILE="$(mktemp)"

          trap 'rm -f "$REQUEST_FILE" "$RESPONSE_FILE"' EXIT

          echo "Preparing Hugging Face API request..."
          echo "Model: $HF_MODEL"

          jq -n \
            --arg model "$HF_MODEL" \
            '{
              model: $model,
              messages: [
                {
                  role: "system",
                  content: "You are an experienced senior software engineer specializing in C#, .NET and secure application development."
                },
                {
                  role: "user",
                  content: "Review this C# method for bugs and suggest a safer implementation: public static int Divide(int a, int b) => a / b;"
                }
              ],
              max_tokens: 512,
              temperature: 0.2,
              stream: false
            }' > "$REQUEST_FILE"

          echo "Calling Hugging Face Inference API..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 120 \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --request POST \
            "https://router.huggingface.co/v1/chat/completions" \
            --header "Authorization: Bearer ${HF_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@$REQUEST_FILE") || {
              echo "::error::Network request to Hugging Face failed."
              exit 1
            }

          echo "HTTP Status: $HTTP_STATUS"

          if [[ ! "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Hugging Face API request failed."

            jq -r '
              .error.message //
              .error //
              .message //
              "Unknown API error"
            ' "$RESPONSE_FILE" 2>/dev/null || true

            exit 1
          fi

          MODEL_RESPONSE=$(jq -r \
            '.choices[0].message.content // empty' \
            "$RESPONSE_FILE")

          if [[ -z "$MODEL_RESPONSE" ]]; then
            echo "::error::Model returned an empty response."
            jq '.' "$RESPONSE_FILE" || true
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "HUGGING FACE API TEST SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Model: $HF_MODEL"
          echo ""
          echo "AI REVIEW RESPONSE:"
          echo "------------------------------------------"
          echo "$MODEL_RESPONSE"
          echo "------------------------------------------"
