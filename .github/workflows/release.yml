name: Release LocalAI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows
    runs-on: windows-latest

    environment:
      name: Windows Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore LocalAI.sln

      - name: Build solution
        run: dotnet build LocalAI.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test LocalAI.sln --configuration Release --no-build

      - name: Publish Windows x64
        run: >
          dotnet publish
          LocalAI.Desktop/LocalAI.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "${{ github.workspace }}\publish\win-x64"

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ github.workspace }}\publish\win-x64\*" `
            -DestinationPath "${{ github.workspace }}\LocalAI-win-x64.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install `
            --id JRSoftware.InnoSetup.7 `
            -e `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}" -replace '^v', ''

          Write-Host "Release version: $version"

          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue

          if ($iscc) {
              $isccPath = $iscc.Source
          }
          else {
              $iscc = Get-ChildItem `
                  "$env:LOCALAPPDATA\Programs", `
                  "C:\Program Files", `
                  "C:\Program Files (x86)" `
                  -Filter "ISCC.exe" `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

              if (-not $iscc) {
                  throw "Inno Setup compiler (ISCC.exe) was not found."
              }

              $isccPath = $iscc.FullName
          }

          Write-Host "Using Inno Setup compiler: $isccPath"

          & $isccPath `
            "/DMyAppVersion=$version" `
            ".\installer\LocalAI.iss"

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup compilation failed."
          }

          Write-Host "Installer build completed successfully."

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}" -replace '^v', ''

          $zip = "${{ github.workspace }}\LocalAI-win-x64.zip"
          $installer = "${{ github.workspace }}\artifacts\installer\LocalAI-Setup-v$version.exe"
          $manual = "${{ github.workspace }}\docs\LocalAI-User-Manual.pdf"

          if (-not (Test-Path $zip)) {
              throw "ZIP package was not found: $zip"
          }

          if (-not (Test-Path $installer)) {
              throw "Installer was not found: $installer"
          }

          if (-not (Test-Path $manual)) {
              throw "User manual was not found: $manual"
          }

          Write-Host "ZIP package:"
          Get-Item $zip | Select-Object FullName, Length

          Write-Host "Windows installer:"
          Get-Item $installer | Select-Object FullName, Length

          Write-Host "User manual:"
          Get-Item $manual | Select-Object FullName, Length

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $version = $env:VERSION -replace '^v', ''

          $zip = "${{ github.workspace }}\LocalAI-win-x64.zip"
          $installer = "${{ github.workspace }}\artifacts\installer\LocalAI-Setup-v$version.exe"
          $manual = "${{ github.workspace }}\docs\LocalAI-User-Manual.pdf"

          gh release create "$env:VERSION" `
            "$installer" `
            "$zip" `
            "$manual" `
            --title "LocalAI $env:VERSION" `
            --generate-notes `
            --latest