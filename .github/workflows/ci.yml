name: LocalAI CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build-and-test:

    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore LocalAI.sln

      - name: Build solution
        run: dotnet build LocalAI.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test LocalAI.sln --configuration Release --no-build